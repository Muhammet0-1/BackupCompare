name: Backup Compare platform tests

on:
  workflow_dispatch:
    inputs:
      target_and_cost_verified:
        description: 'Run only after repository target, visibility and no-charge conditions are verified'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backup-compare-platform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    if: ${{ inputs.target_and_cost_verified }}
    name: ${{ matrix.runner }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner: [windows-2025, macos-15-intel]
        python: ['3.9', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      CI_RUNNER_LABEL: ${{ matrix.runner }}
      CI_REQUESTED_PYTHON: ${{ matrix.python }}
    steps:
      - name: Checkout approved commit
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python ${{ matrix.python }}
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
          check-latest: false
      - name: Development suite - 20 original tests
        timeout-minutes: 3
        run: python -B ci/run_tests.py --suite development
      - name: Independent suite - 7 original tests
        if: ${{ !cancelled() && steps.python.outcome == 'success' }}
        timeout-minutes: 3
        run: python -B ci/run_tests.py --suite independent

